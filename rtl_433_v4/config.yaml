name: "RTL_433 v4"
version: "2.0.0"
slug: "rtl_433_v4"
description: "rtl_433 built against current rtl-sdr-blog librtlsdr (proper RTL-SDR Blog v4 support). Publishes to MQTT for pbkhrv autodiscovery to surface as HA entities."
arch:
  - aarch64
url: "https://github.com/garysb/rtl_433-v4-hass-addons"
startup: services
boot: auto
init: false
usb: true
udev: true
hassio_api: true
homeassistant_api: false
host_network: false
options:
  frequency: "433.92M"
  gain: 0
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "mqtt"
  mqtt_pass: ""
  pulse_detect: "autolevel"
  extra_args: ""
schema:
  frequency: "str"
  gain: "int(0,496)"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_user: "str"
  mqtt_pass: "password"
  pulse_detect: "list(autolevel|minmax|magest)"
  extra_args: "str?"
